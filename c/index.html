<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루사주 궁합</title>
<meta property="og:title" content="우리 사주 궁합 보러 갈래? 💞">
<meta property="og:description" content="생년월일만 넣으면 두 사람의 사주 궁합이 바로 나와요 · 하루사주">
<meta property="og:image" content="https://dks804.github.io/og.png">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0F0D24; --card:#1C1940; --border:#332E66; --gold:#E8C77A; --text:#F4F0E6; --sub:#A9A3C7; }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(ellipse at top, #2a2470 0%, #0F0D24 60%) fixed; color:var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { color: var(--gold); font-family: "Nanum Myeongjo", serif; text-align:center; font-size: 34px; margin: 6px 0 4px; }
  .moon { text-align:center; color: var(--gold); font-size: 42px; }
  #intro { text-align:center; font-size: 17px; line-height: 1.6; margin: 10px 0 22px; }
  .sub { color: var(--sub); font-size: 14px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  label.f { display:block; color: var(--gold); font-weight: 700; font-size: 14px; margin: 14px 0 8px; }
  input[type=text], input[type=number] { background:#151233; border:1px solid var(--border); color:var(--text); border-radius: 12px; height: 48px; padding: 0 12px; font-size: 17px; width: 100%; }
  .row { display:flex; gap: 8px; align-items:center; }
  .row span { color: var(--sub); }
  .seg { display:inline-flex; align-items:center; gap:6px; margin-right: 14px; font-size: 15px; }
  .btn { display:block; width:100%; text-align:center; background: var(--gold); color:#231C05; font-weight: 800; font-size: 17px; border:0; border-radius: 26px; height: 52px; line-height: 52px; text-decoration:none; margin-top: 18px; cursor:pointer; }
  #err { color:#FF7A7A; margin-top: 12px; min-height: 18px; }
  .hero { text-align:center; }
  .pair { font-size: 22px; font-weight: 700; }
  .heart { color:#FF8A73; }
  .score { color: var(--gold); font-size: 72px; font-family: serif; font-weight: 700; line-height: 1.1; margin-top: 10px; }
  .score small { font-size: 22px; }
  .title { color: var(--gold); font-size: 21px; font-weight: 700; margin: 4px 0; }
  .lbl { color: var(--gold); font-weight: 700; margin-bottom: 6px; }
  p { margin: 0; line-height: 1.65; font-size: 15px; }
  .cta { border-color: var(--gold); }
  footer { text-align:center; color: var(--sub); font-size: 12px; margin-top: 24px; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <div class="moon">☾</div>
  <h1>하루사주</h1>
  <div id="intro"></div>
  <div class="card" id="formCard">
    <label class="f" for="name">내 이름</label>
    <input id="name" type="text" maxlength="12" placeholder="이름 또는 닉네임">
    <label class="f">성별</label>
    <div><label class="seg"><input type="radio" name="g" id="gF" checked> 여성</label><label class="seg"><input type="radio" name="g" id="gM"> 남성</label></div>
    <label class="f">생년월일</label>
    <div style="margin-bottom:8px"><label class="seg"><input type="radio" name="c" id="cS" checked> 양력</label><label class="seg"><input type="radio" name="c" id="cL"> 음력</label><label class="seg" id="leapWrap" style="display:none"><input type="checkbox" id="leap"> 윤달</label></div>
    <div class="row"><input id="y" type="number" inputmode="numeric" placeholder="1995"><span>년</span><input id="m" type="number" inputmode="numeric" placeholder="3"><span>월</span><input id="d" type="number" inputmode="numeric" placeholder="21"><span>일</span></div>
    <label class="f">태어난 시간 (모르면 비워두세요)</label>
    <div class="row"><input id="h" type="number" inputmode="numeric" placeholder="14"><span>시</span><input id="mi" type="number" inputmode="numeric" placeholder="30"><span>분</span></div>
    <button class="btn" id="go">궁합 결과 보기</button>
    <div id="err"></div>
    <div class="sub" style="margin-top:6px">입력한 정보는 이 화면에서만 계산되고 어디에도 저장·전송되지 않아요.</div>
  </div>
  <div id="result"></div>
  <footer>재미와 참고용 콘텐츠입니다 · <a href="../privacy.html">개인정보처리방침</a></footer>
</main>
<script src="compat.js"></script>
</body>
</html>
